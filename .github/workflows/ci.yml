name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Lint
        run: python -m ruff check .
      - name: Unit, parity and site tests
        run: python -m pytest -q
      - name: Execute notebook from a clean kernel
        run: jupyter nbconvert --to notebook --execute analysis.ipynb --output analysis_executed.ipynb
      - name: Deliverables render from results.json and every number is traceable
        run: |
          python scripts/render_deliverables.py
          python scripts/check_numbers.py
          git diff --exit-code -- results/results.json deliverables/memo.md || (echo "results or memo changed on re-run" && exit 1)

  package:
    # Builds the PDFs and submission.zip exactly as scripts/package.sh does locally. package.sh
    # itself enforces the page limits, the required-file manifest and the archive integrity
    # test, and exits non-zero (failing this job) if any check fails.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python deps, pandoc, poppler and Chromium (Playwright)
        run: |
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y pandoc zip unzip poppler-utils
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Build and verify submission.zip (page limits, manifest, integrity)
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: submission
          if-no-files-found: warn
          path: |
            submission.zip
            build/*.pdf
