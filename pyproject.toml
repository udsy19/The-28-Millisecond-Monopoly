[project]
name = "photon-that-didnt-show-up"
version = "1.0.0"
description = "Reproducible diligence of a CHSH 'quantum trading edge': photon loss, the detection loophole and one classical bit."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Udaya Tejas" }]
keywords = ["CHSH", "entanglement", "detection loophole", "photon loss", "due diligence"]

[project.urls]
Homepage = "https://udsy19.github.io/The-28-Millisecond-Monopoly/"
Repository = "https://github.com/udsy19/The-28-Millisecond-Monopoly"
Issues = "https://github.com/udsy19/The-28-Millisecond-Monopoly/issues"

# The analysis is run from the repository (not installed); dependencies are pinned in requirements.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["submission", "_site", "build", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"scripts/build_notebook.py" = ["E501"]
